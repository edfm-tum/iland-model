<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="BITE standard thumbnail">
  <rect width="360" height="200" fill="#f4f6f4"/>

  <g transform="translate(-5, 0)">
    <!-- Left tree: conifer crown + inverted-cone base with concave bite -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Inverted triangle base -->
      <polygon points="75,116 135,116 105,162" fill="#d4c0ac" stroke="#73857a" stroke-width="1.5"/>
      <!-- Bite cutout on lower-left flank -->
      <path d="M 79,122 C 97,118 109,136 98,151 Z" fill="#f4f6f4"/>
      <!-- Hairline original edge across bite + crisp inner bite arc -->
      <line x1="75" y1="116" x2="105" y2="162" stroke="#8e9e94" stroke-width="1.1"/>
      <path d="M 79,122 C 97,118 109,136 98,151" fill="none" stroke="#73857a" stroke-width="1.5"/>

      <!-- Three-tier stylized conifer silhouette -->
      <path d="M 105,38
               C 103,50 95,58 87,62
               C 92,62 96,61 98,60
               C 94,70 86,78 78,84
               C 84,84 90,83 94,81
               C 88,95 76,106 64,113
               C 78,120 92,118 105,115
               C 118,118 132,120 146,113
               C 134,106 122,95 116,81
               C 120,83 126,84 132,84
               C 124,78 116,70 112,60
               C 114,61 118,62 123,62
               C 115,58 107,50 105,38 Z"
            fill="#acc5b4" stroke="#73857a" stroke-width="1.6"/>
    </g>

    <!-- Center tree: broadleaf trunk + crown with dotted-outline bitten upper-left lobe -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Flared trunk -->
      <path d="M 176,104 L 195,104 C 195,122 199,135 206,146 L 165,146 C 172,135 176,122 176,104 Z"
            fill="#d4c0ac" stroke="#73857a" stroke-width="1.6"/>

      <!-- Remaining broadleaf green canopy (bitten along upper-left curve) -->
      <path d="M 152,90
               C 146,96 149,106 164,108
               C 178,110 198,107 207,99
               C 218,96 225,84 217,74
               C 221,64 212,51 198,50
               C 201,68 184,91 152,90 Z"
            fill="#acc5b4" stroke="#73857a" stroke-width="1.6"/>

      <!-- Dotted outline showing the missing bitten canopy contour -->
      <path d="M 152,90
               C 144,82 146,66 158,61
               C 159,51 171,44 181,48
               C 186,44 194,45 198,50"
            fill="none" stroke="#8e9e94" stroke-width="1.6" stroke-dasharray="1.8 3.2"/>
    </g>

    <!-- Calm, understated BITE wordmark -->
    <text x="242" y="106"
          fill="#6d8175"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="27"
          font-weight="600"
          letter-spacing="0.1em">BITE</text>
  </g>
</svg>
