name: Build & Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Version Folder in iland-docs/ (e.g., dev, 2.2, 2.3)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - '2.2'
          - '2.3'
      update_latest_symlink:
        description: 'Update "latest" symlink to point to this version?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    name: Render Quarto & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate API Documentation Pages
        run: |
          python3 docs/apidoc/generate.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Render Quarto Documentation
        run: |
          quarto render docs/

      - name: Configure SSH Private Key & Host Verification
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via Rsync over SSH
        run: |
          TARGET="${{ inputs.target_version }}"
          echo "Deploying rendered docs to /var/www/html/iland-docs/${TARGET}/..."
          
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT || 22 }}" \
            docs/_site/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/iland-docs/${TARGET}/

      - name: Update 'latest' Symlink (Optional)
        if: inputs.update_latest_symlink == true
        run: |
          TARGET="${{ inputs.target_version }}"
          echo "Updating 'latest' symlink -> ${TARGET}..."
          
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "ln -sfn /var/www/html/iland-docs/${TARGET} /var/www/html/iland-docs/latest"
