name: Qt qmake Cross-Platform Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'manual build'
        required: false
        default: 'Manual Dev Build'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          # Use 6.8.3 for Windows and Linux, and 6.11.1 for macOS (required for Xcode/Clang compatibility)
          version: ${{ matrix.os == 'macos-latest' && '6.11.1' || '6.8.3' }}
          modules: ${{ matrix.os == 'ubuntu-latest' && 'qtcharts qtwayland' || 'qtcharts' }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}

          
      # --- dependencies ---
      - name: Install FreeImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfreeimage-dev libxcb-cursor0

      - name: Install FreeImage (macOS)
        if: runner.os == 'macOS'
        run: brew install freeimage

      # --- Build Phase ---
      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Build Project (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./build_iland.ps1 2>&1 | Tee-Object -FilePath build_log.txt

      - name: Build Project (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x ./build_iland.sh
          ./build_iland.sh 2>&1 | tee build_log.txt

      # --- Deployment Phase ---

      # 1. Windows
      - name: Windows Deployment
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir deploy-win
          copy src/iland/build/release/release/iland.exe deploy-win/
          copy src/ilandc/build/release/release/ilandc.exe deploy-win/
          copy src/fonstudio/build/release/release/fonstudio.exe deploy-win/
          copy libs/win/FreeImage.dll deploy-win/
          windeployqt --release --no-translations --compiler-runtime --qmldir src/iland/qml deploy-win/iland.exe
          move build_log.txt deploy-win/

      # 2. Linux
      - name: Linux Deployment
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir deploy-linux
          
          # 1. Locate the Qt installation path provided by the jurplel action
          QT_DIR=$(qmake -query QT_INSTALL_PREFIX)
          
          # 2. Set up the AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/platformthemes
          
          # 3. Copy built executables
          cp src/iland/build/release/iland AppDir/usr/bin/
          cp src/ilandc/build/release/ilandc AppDir/usr/bin/
          cp src/fonstudio/build/release/fonstudio AppDir/usr/bin/
          
          # 4. Copy Qt Wayland shared libraries into AppDir/usr/lib/
          cp -d $QT_DIR/lib/libQt6Wayland*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -d $QT_DIR/lib/libQt6WlShellIntegration*.so* AppDir/usr/lib/ 2>/dev/null || true
          
          # 5. Inject Wayland, Portal, GTK3, and Input plugins
          cp -d $QT_DIR/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
          cp -rd $QT_DIR/plugins/wayland-shell-integration AppDir/usr/plugins/
          cp -rd $QT_DIR/plugins/wayland-graphics-integration-client AppDir/usr/plugins/
          cp -rd $QT_DIR/plugins/wayland-decoration-client AppDir/usr/plugins/ 2>/dev/null || true
          cp -d $QT_DIR/plugins/platformthemes/libqgtk3.so AppDir/usr/plugins/platformthemes/
          cp -d $QT_DIR/plugins/platformthemes/libqxdgdesktopportal.so AppDir/usr/plugins/platformthemes/ 2>/dev/null || true
          cp -rd $QT_DIR/plugins/platforminputcontexts AppDir/usr/plugins/ 2>/dev/null || true
          cp -rd $QT_DIR/plugins/xcbglintegrations AppDir/usr/plugins/ 2>/dev/null || true
          
          # 6. Setup .desktop file and icon (required by linuxdeployqt for AppImage creation)
          # Note: Replace 'iland.png' with the actual path to your application icon in the repository
          echo -e "[Desktop Entry]\nName=iLand\nExec=iland\nIcon=iland\nType=Application\nCategories=Science;" > AppDir/iland.desktop
          touch AppDir/iland.png

          # Keep only the SQLite driver; delete all others (Mimer, ODBC, PostgreSQL, etc.) to prevent ldd failures
          find $QT_DIR/plugins/sqldrivers/ -type f -not -name 'libqsqlite.so' -delete
          
          # 7. Run linuxdeployqt (pass wayland platform plugins as extra executables to bundle their dependencies)
          EXTRA_EXEC=""
          for p in AppDir/usr/plugins/platforms/libqwayland*.so; do
            if [ -f "$p" ]; then
              EXTRA_EXEC="$EXTRA_EXEC -executable=$p"
            fi
          done

          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/bin/iland $EXTRA_EXEC -appimage -unsupported-allow-new-glibc -qmldir=src/iland/qml
          
          # 8. Move final artifacts
          mv iLand*.AppImage deploy-linux/
          cp build_log.txt deploy-linux/

      # 3. macOS
      - name: macOS Deployment
        if: matrix.os == 'macos-latest'
        run: |
          mkdir deploy-mac
          cp -r src/iland/build/release/iland.app deploy-mac/
          cp -r src/ilandc/build/release/ilandc deploy-mac/
          macdeployqt deploy-mac/iland.app -qmldir=src/iland/qml
          cp build_log.txt deploy-mac/

      # --- Artifact Upload ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iLand-Build-${{ matrix.os }}
          path: |
            deploy-win/
            deploy-linux/
            deploy-mac/
