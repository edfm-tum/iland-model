name: Qt qmake Cross-Platform Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'manual build'
        required: false
        default: 'Manual Dev Build'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          # qtcharts necessary to be installed extra
          modules: 'qtcharts'
          # specific toolchain for windows
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}

      # --- dependencies ---
      - name: Install FreeImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfreeimage-dev

      - name: Install FreeImage (macOS)
        if: runner.os == 'macOS'
        run: brew install freeimage

      # --- Build Phase ---
      - name: Build Project (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # runs windows build script and creates a log file
          ./build_iland.ps1 2>&1 | Tee-Object -FilePath build_log.txt

      - name: Build Project (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          # chmod to make sure it is executable
          chmod +x ./build_iland.sh
          ./build_iland.sh 2>&1 | tee build_log.txt

      # --- Deployment Phase ---

      # 1. Windows
      - name: Windows Deployment
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir deploy-win
          copy src/iland/build/release/release/iland.exe deploy-win/
          copy src/ilandc/build/release/release/ilandc.exe deploy-win/
          copy src/fonstudio/build/release/release/fonstudio.exe deploy-win/
          copy libs/win/FreeImage.dll deploy-win/
          windeployqt --release --no-translations --compiler-runtime --qmldir src/iland/qml deploy-win/iland.exe
          # copy log
          move build_log.txt deploy-win/

      # 2. Linux
      - name: Linux Deployment
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir deploy-linux
          cp src/iland/build/release/iland deploy-linux/
          cp src/ilandc/build/release/ilandc deploy-linux/
          copy src/fonstudio/build/release/fonstudio.exe deploy-linux/
          cp build_log.txt deploy-linux/

      # 3. macOS
      - name: macOS Deployment
        if: matrix.os == 'macos-latest'
        run: |
          mkdir deploy-mac
          cp -r src/iland/build/release/iland.app deploy-mac/
          cp -r src/ilandc/build/release/ilandc.app deploy-mac/
          # bundle everything into an app
          macdeployqt deploy-mac/iland.app -qmldir=src/iland/qml
          cp build_log.txt deploy-mac/

      # --- Artifact Upload ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iLand-Build-${{ matrix.os }}
          path: |
            deploy-win/
            deploy-linux/
            deploy-mac/
